<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的上报</title>
  <link rel="stylesheet" href="/static/app.css?v=20260804-4">
</head>
<body class="mobile">
<main class="phone-card wide-phone">
  <div class="mobile-nav"><b>{{ user.display_name }}</b><a href="/mobile">主页</a><a href="/mobile/report">发货上报</a><a href="/mobile/orders">补货查看</a><a href="/logout">退出</a></div>
  <h1>我的上报</h1>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <div class="mobile-list" id="my-reports-list">
    {% if not reports %}
    <p class="empty">还没有上报记录。</p>
    {% endif %}
    {% include "mobile/my_reports_items.html" %}
  </div>
  {% if has_more %}
  <button
    class="load-more-btn"
    data-load-more="/mobile/my-reports?page={{ page + 1 }}"
    data-target="#my-reports-list"
    data-next-page="{{ page + 1 }}"
    data-has-more="1">加载更多</button>
  {% endif %}
</main>
<script src="/static/app.js?v=20260804-4"></script>
</body>
</html>
